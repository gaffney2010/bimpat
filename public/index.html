<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bimpat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Bimpat</h1>
  <div id="game-area">
    <div id="grid"></div>
    <div id="counters">
      <div class="counter" id="blue-counter">
        <span class="counter-dot blue-dot"></span>
        <span class="counter-value" id="blue-count">6</span>
      </div>
      <div class="counter" id="red-counter">
        <span class="counter-dot red-dot"></span>
        <span class="counter-value" id="red-count">0</span>
      </div>
    </div>
  </div>
  <button id="submit-btn">Submit</button>
  <div id="congrats">Congrats! <button id="new-game-btn">New Game</button></div>
  <script src="game.js"></script>
</body>
</html>
